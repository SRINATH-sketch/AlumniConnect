<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Network System - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .logout-btn {
            padding: 8px 20px;
            border: 2px solid white;
            border-radius: 20px;
            background: transparent;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        .role-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .role-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .role-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .role-btn.active {
            background: #667eea;
            color: white;
        }

        .role-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .content {
            padding: 30px;
            min-height: 400px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-title {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .navigation {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .nav-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .nav-card h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .nav-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .card h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
        }

        .badge-student { background: #4CAF50; color: white; }
        .badge-alumni { background: #2196F3; color: white; }
        .badge-pending { background: #FF9800; color: white; }
        .badge-approved { background: #4CAF50; color: white; }

        .chat-message {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .chat-message.sent {
            background: #667eea;
            color: white;
            margin-left: 50px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .chat-input input {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Alumni Network System</h1>
            <p>Connecting Students, Alumni, and Administrators</p>
            <div class="user-info">
                <span class="user-name" id="userName">Loading...</span>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>

        <div class="role-selector" id="roleSelector">
            <button class="role-btn" onclick="showRole('student')" id="studentBtn">👨‍🎓 Student Portal</button>
            <button class="role-btn" onclick="showRole('alumni')" id="alumniBtn">🎯 Alumni Portal</button>
            <button class="role-btn" onclick="showRole('admin')" id="adminBtn">⚙ Admin Panel</button>
        </div>

        <div class="content" id="mainContent">
            <div class="loading">Loading your dashboard...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAhdtT0VMBmz8-vsVVa9KlcycSHnvtyxE4",
            authDomain: "alumni-connection-007.firebaseapp.com",
            projectId: "alumni-connection-007",
            storageBucket: "alumni-connection-007.appspot.com",
            messagingSenderId: "210833800961",
            appId: "1:210833800961:web:cb46b2ef133bd0d48a6500",
            measurementId: "G-MJQ8BJ5520"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserType = null;

        // Check authentication and load user data
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                // Get user data from Firestore
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    currentUserType = userData.userType;
                    document.getElementById('userName').textContent = userData.fullName || user.email;
                    
                    // Setup UI based on user type
                    setupUIForUserType(currentUserType);
                } else {
                    document.getElementById('userName').textContent = user.email;
                    // Default to student if no user data found
                    setupUIForUserType('student');
                }
            } catch (error) {
                console.error("Error loading user data:", error);
                document.getElementById('userName').textContent = user.email;
                setupUIForUserType('student');
            }
        });

        function setupUIForUserType(userType) {
            const mainContent = document.getElementById('mainContent');
            const studentBtn = document.getElementById('studentBtn');
            const alumniBtn = document.getElementById('alumniBtn');
            const adminBtn = document.getElementById('adminBtn');

            // Enable only the relevant portal button
            studentBtn.disabled = userType !== 'student';
            alumniBtn.disabled = userType !== 'alumni';
            adminBtn.disabled = userType !== 'admin';

            // Show the appropriate dashboard
            if (userType === 'student') {
                showRole('student');
                studentBtn.click();
            } else if (userType === 'alumni') {
                showRole('alumni');
                alumniBtn.click();
            } else if (userType === 'admin') {
                showRole('admin');
                adminBtn.click();
            }
        }

        // Logout function
        window.handleLogout = async function() {
            try {
                await signOut(auth);
                window.location.href = "login.html";
            } catch (error) {
                console.error("Error signing out:", error);
                alert("Error signing out. Please try again.");
            }
        };

        // Page navigation functions
        let currentRole = 'student';
        let currentPage = 'student';

        window.showRole = function(role) {
            currentRole = role;
            
            // Update button states
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // Show selected role page
            const rolePage = document.getElementById(role);
            if (rolePage) {
                rolePage.classList.add('active');
                currentPage = role;
            }
        };

        window.showPage = function(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // Show selected page
            const selectedPage = document.getElementById(pageId);
            if (selectedPage) {
                selectedPage.classList.add('active');
                currentPage = pageId;
            }
        };
    </script>
